<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>预览：{{TITLE}}</title>
<!-- 本页只用于本地预览。复制按钮只复制中间的文章区域；页面自身的样式和脚本不会进入公众号。 -->
<style>
  body { margin: 0; background: #ededed; font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  .bar { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #ddd; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; z-index: 1; }
  .bar b { font-size: 15px; }
  .bar span { color: #666; font-size: 13px; }
  .bar button { margin-left: auto; padding: 6px 14px; border: 0; border-radius: 4px; background: #07c160; color: #fff; font-size: 14px; cursor: pointer; }
  .meta { max-width: 677px; margin: 16px auto 0; padding: 12px 16px; background: #fffbe6; border: 1px solid #ffe58f; font-size: 13px; color: #614700; }
  .phone { max-width: 677px; margin: 16px auto 48px; background: #fff; padding: 20px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
</style>
</head>
<body>
<div class="bar">
  <b>{{TITLE}}</b>
  <span>主题：{{THEME}}</span>
  <span>{{STATS}}</span>
  <button id="copy" type="button">复制正文</button>
</div>
<div class="meta">摘要：{{DIGEST}}<br>发布方式：手动。复制后在公众号编辑器里粘贴，重新上传图片和封面，人工检查后再发布。</div>
<div class="phone"><div id="article">{{ARTICLE}}</div></div>
<script>
document.getElementById('copy').addEventListener('click', async () => {
  const el = document.getElementById('article');
  const btn = document.getElementById('copy');
  try {
    const htmlBlob = new Blob([el.innerHTML], { type: 'text/html' });
    const textBlob = new Blob([el.innerText], { type: 'text/plain' });
    await navigator.clipboard.write([new ClipboardItem({ 'text/html': htmlBlob, 'text/plain': textBlob })]);
  } catch (e) {
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
  }
  btn.textContent = '已复制';
  setTimeout(() => { btn.textContent = '复制正文'; }, 1500);
});
</script>
</body>
</html>
